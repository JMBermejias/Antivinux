name: Construir y publicar Antivinux

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: antivinux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Generar y publicar el paquete .deb
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determinar la version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version calculada: ${VERSION}"

      - name: Aplicar la version en el codigo
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" antivinux/__init__.py
          grep '__version__' antivinux/__init__.py

      - name: Comprobar sintaxis de Python
        run: |
          python3 -m py_compile $(find antivinux packaging -name '*.py') \
            antivinux-launcher.py setup.py

      - name: Ejecutar pruebas del nucleo
        run: python3 -m unittest discover -s tests -v

      - name: Instalar GTK para la prueba de interfaz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0 xvfb

      - name: Probar el arranque de la interfaz grafica
        run: xvfb-run -a /usr/bin/python3 tests/test_ui_smoke.py

      - name: Construir el paquete .deb
        run: |
          chmod +x packaging/build_deb.sh packaging/install_deps.sh \
                   data/antivinux-update-db.sh
          ./packaging/build_deb.sh

      - name: Inspeccionar el paquete generado
        run: |
          dpkg-deb --info dist/antivinux_*_all.deb
          dpkg-deb --contents dist/antivinux_*_all.deb | head -40

      - name: Subir el paquete como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: antivinux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publicar una nueva release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Antivinux ${{ steps.version.outputs.version }}
          files: dist/*.deb
          generate_release_notes: true
          make_latest: true
